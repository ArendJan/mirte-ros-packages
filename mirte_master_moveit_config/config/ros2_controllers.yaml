# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    mirte_master_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_controller:
  ros__parameters:
    joints:
      - arm_Rot_joint
      - arm_Shoulder_joint
      - arm_Elbow_joint
      - arm_Wrist_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
mirte_master_arm_controller:
  ros__parameters:
    joints:
      - arm_Rot_joint
      - arm_Shoulder_joint
      - arm_Elbow_joint
      - arm_Wrist_joint
    command_interfaces:
      - position
    state_interfaces:
      - position