name: ros-ci
on:
  pull_request:
  push:
permissions:
  contents: write
jobs:
  build_testing:
    runs-on: self-hosted
    strategy:
        matrix:
                ros_distro: [humble]
                deb_distro: [jammy]
                arch: [
                    amd64, 
                    arm64, 
                    # armhf
                    ]
        fail-fast: false
    container:
      image: ghcr.io/catthehacker/ubuntu:js-22.04
    steps:
      - run: |
          set -xe
          # PATH="/opt/acttoolcache/node/20.18.0/x64/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games:/snap/bin"
          which /opt/acttoolcache/node/20.18.1/x64/bin/node
          /opt/acttoolcache/node/20.18.1/x64/bin/node --version
          # link node to /__e/node20/bin/node
          sudo mkdir -p /__e/node20/bin
          ln -s /opt/acttoolcache/node/20.18.1/x64/bin/node /__e/node20/bin/node 
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: self-checkout
        run: |
              mkdir -p ./srcO/
              mv ./mirte_* ./srcO/
              rm -rf ./src
      - uses: arendjan/ros-deb-builder-action@test_self2 # allows for failing builds
        with:
          ROS_DISTRO: ${{ matrix.ros_distro }}
          DEB_DISTRO: ${{ matrix.deb_distro }}
          DEB_ARCH: ${{ matrix.arch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOS_FILE: ./sources.repos
          SKIP_CHECKOUT: true
          PACKAGES_BRANCH: ros_mirte_${{ matrix.ros_distro }}_${{ matrix.deb_distro }}_${{ matrix.arch }}${{ github.ref == 'refs/heads/develop' && '_develop' || '' }}

        #   SBUILD_CONF: "$enable_network = 1;"
        #   Skip pushing to repo when not on main branch
          SKIP_PUSH: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}
          UPLOAD_ARTIFACTS: ${{ github.ref != 'refs/heads/main'  && github.ref != 'refs/heads/develop' }}
          CONTINUE_ON_ERROR: ${{ github.ref != 'refs/heads/main'  && github.ref != 'refs/heads/develop' }} # allows for failing builds