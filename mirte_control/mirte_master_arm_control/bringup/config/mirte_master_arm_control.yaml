---
/**:
  ros__parameters:

    # TODO: configs cleanup
    # ros_control_boilerplate Settings -----------------------
    # Settings for ros_control control loop
    generic_hw_control_loop:
      loop_hz: 300
      cycle_time_error_threshold: 0.04
    # Settings for ros_control hardware interface
    hardware_interface:
      joints: [shoulder, arm, arm2, gripper_joint]
      sim_control_mode: 0  # 0: position, 1: velocity
    # Publish all joint states ----------------------------------
    # Creates the /joint_states topic necessary in ROS
    joint_state_controller:
      type: joint_state_controller/JointStateController
      publish_rate: 50
    # Joint Trajectory Controller -------------------------------
    # For detailed explanations of parameter see http://wiki.ros.org/joint_trajectory_controller
    position_trajectory_controller:
      type: position_controllers/JointTrajectoryController
      # These joints can likely just be copied from the hardware_interface list above
      joints: [shoulder, arm, arm2, gripper_joint]
      constraints:
        goal_time: 5.0
          # stopped_position_tolerance: 0.4  #  Defaults to 0.01
        shoulder:
          trajectory: 0.60
          goal: 0.0
        arm:
          trajectory: 0.60
          goal: 0.0
        arm2:
          trajectory: 0.60
          goal: 0.0
        gripper_joint:
          trajectory: 0.60
          goal: 0.0
      # gains:
      #     joint1: {p: 2.0,  i: 0.0, d: 0.01, i_clamp: 1}
      #     joint2: {p: 2.0,  i: 0.0, d: 0.01, i_clamp: 1}

        # state_publish_rate:  50  # Defaults to 50
        # action_monitor_rate: 20  # Defaults to 20
        # hold_trajectory_duration: 0  #  Defaults to 0.5
    # Individual Position Controllers ---------------------------------------
    # Allows to send individual ROS msg of Float64 to each joint separately
    shoulder_position_controller:
      type: position_controllers/JointPositionController
      joint: shoulder
      pid: {p: 100.0, i: 0.01, d: 10.0}
    arm_position_controller:
      type: position_controllers/JointPositionController
      joint: arm
      pid: {p: 100.0, i: 0.01, d: 10.0}
    arm2_position_controller:
      type: position_controllers/JointPositionController
      joint: arm2
      pid: {p: 100.0, i: 0.01, d: 10.0}
    gripper_joint_position_controller:
      type: position_controllers/JointPositionController
      joint: gripper_joint
      pid: {p: 100.0, i: 0.01, d: 10.0}
    # Group Position Controllers ---------------------------------------
    # Allows to send single ROS msg of Float64MultiArray to all joints
    joint_follower_controller:
      type: position_controllers/JointGroupPositionController
      joints: [shoulder, arm, arm2, gripper_joint]
/**/controller_manager:
  ros__parameters:
    update_rate: 10  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    joint_follower_controller:
      type: position_controllers/JointGroupPositionController
      joints: [shoulder, arm, arm2, gripper_joint]
    # mirte_master_arm_controller:
    #   type: mirte_control/MirteMasterArmController

/**/mirte_base_controller:
  ros__parameters:
    # hardware_parameters:
    # ticks: 1320
    use_stamped_vel: true # This will become the default in the future
    reference_timeout: 0.25
    command_timeout: 0.25
    command_joint_names: ["pid_wheels_controller/left_front_wheel_joint", "pid_wheels_controller/left_rear_wheel_joint", "pid_wheels_controller/right_rear_wheel_joint", "pid_wheels_controller/right_front_wheel_joint"]
    state_joint_names: ["left_front_wheel_joint", "left_rear_wheel_joint", "right_rear_wheel_joint", "right_front_wheel_joint"]
    interface_name: velocity

    kinematics:
      base_frame_offset: { x: 0.0, y: 0.0, theta: 0.0 }

      wheels_radius: 0.051

        # Wheels kinematic parameters [m]: (from odometry.hpp)
        # lx and ly represent the distance from the robot's center to the wheels
        #  projected on the x and y axis with origin at robots center respectively,
        #  sum_of_robot_center_projection_on_X_Y_axis_ = lx+ly

      sum_of_robot_center_projection_on_X_Y_axis: 0.225 # 0.18/2+0.27/2 = 0.225
          # wheel_separation_x: 0.18
          # wheel_separation_y: 0.27


    # These need to be evaluated since this controller does not support frame_prefixes
    base_frame_id: "$(var frame_prefix '')base_link"
    odom_frame_id: "$(var frame_prefix '')odom"

    enable_odom_tf: true

    twist_covariance_diagonal: [0.0, 7.0, 14.0, 21.0, 28.0, 35.0]

    pose_covariance_diagonal: [0.0, 7.0, 14.0, 21.0, 28.0, 35.0]



/**/pid_wheels_controller:
  ros__parameters:
    command_interface: velocity

    reference_and_state_interfaces: ["velocity"]

    # reference_and_state_dof_names:
    dof_names:
      - left_front_wheel_joint
      - left_rear_wheel_joint
      - right_rear_wheel_joint
      - right_front_wheel_joint
    gains:
      left_front_wheel_joint: {p: 1.0, i: 0.0, d: 0.0, i_clamp_max: 5.0, i_clamp_min: -5.0}
      left_rear_wheel_joint: {p: 1.0, i: 0.0, d: 0.0, i_clamp_max: 5.0, i_clamp_min: -5.0}
      right_rear_wheel_joint: {p: 1.0, i: 0.0, d: 0.0, i_clamp_max: 5.0, i_clamp_min: -5.0}
      right_front_wheel_joint: {p: 1.0,i: 0.0, d: 0.0, i_clamp_max: 5.0, i_clamp_min: -5.0}

/**/joint_follower_controller:
  ros__parameters:
    joints: [arm_Rot_joint, arm_Elbow_joint, arm_Shoulder_joint, arm_Wrist_joint]